<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" style="background:#FFFDFC; font-family:'Inter', sans-serif;">
  <defs>
    <linearGradient id="wineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92003A"/>
      <stop offset="100%" stop-color="#F62477"/>
    </linearGradient>
  </defs>

  <!-- Top App Bar -->
  <text x="24" y="56" font-family="'Playfair Display', serif" font-size="24" font-weight="700" fill="#92003A">Cycle &amp; Ovulation</text>

  <!-- Month Header -->
  <g transform="translate(20, 80)">
    <rect width="350" height="52" rx="16" fill="#FFF0FA"/>
    <text x="32" y="32" font-size="16" fill="#92003A">‹</text>
    <text x="175" y="32" font-size="16" font-weight="700" fill="#92003A" text-anchor="middle">August 2026</text>
    <text x="318" y="32" font-size="16" fill="#92003A">›</text>
  </g>

  <!-- Calendar Grid Mockup -->
  <g transform="translate(20, 144)">
    <rect width="350" height="260" rx="24" fill="#FFFFFF" stroke="#FFE5F3" stroke-width="1.5"/>
    
    <!-- Weekdays -->
    <text x="40" y="30" font-size="12" font-weight="600" fill="#7A6472" text-anchor="middle">S</text>
    <text x="85" y="30" font-size="12" font-weight="600" fill="#7A6472" text-anchor="middle">M</text>
    <text x="130" y="30" font-size="12" font-weight="600" fill="#7A6472" text-anchor="middle">T</text>
    <text x="175" y="30" font-size="12" font-weight="600" fill="#7A6472" text-anchor="middle">W</text>
    <text x="220" y="30" font-size="12" font-weight="600" fill="#7A6472" text-anchor="middle">T</text>
    <text x="265" y="30" font-size="12" font-weight="600" fill="#7A6472" text-anchor="middle">F</text>
    <text x="310" y="30" font-size="12" font-weight="600" fill="#7A6472" text-anchor="middle">S</text>

    <!-- Period Days Ribbon -->
    <rect x="22" y="55" width="220" height="34" rx="17" fill="#FFE0F4"/>
    <circle cx="40" cy="72" r="15" fill="#92003A"/>
    <text x="40" y="77" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="85" y="77" font-size="12" font-weight="600" fill="#92003A" text-anchor="middle">2</text>
    <text x="130" y="77" font-size="12" font-weight="600" fill="#92003A" text-anchor="middle">3</text>
    <text x="175" y="77" font-size="12" font-weight="600" fill="#92003A" text-anchor="middle">4</text>
    <text x="220" y="77" font-size="12" font-weight="600" fill="#92003A" text-anchor="middle">5</text>

    <!-- Fertile Window Ribbon -->
    <rect x="68" y="105" width="220" height="34" rx="17" fill="#E8F5E9"/>
    <text x="85" y="127" font-size="12" font-weight="600" fill="#2E7D32" text-anchor="middle">11</text>
    <text x="130" y="127" font-size="12" font-weight="600" fill="#2E7D32" text-anchor="middle">12</text>
    <circle cx="175" cy="122" r="15" fill="#2E7D32"/>
    <text x="175" y="127" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">14</text>
    <text x="220" y="127" font-size="12" font-weight="600" fill="#2E7D32" text-anchor="middle">15</text>
    <text x="265" y="127" font-size="12" font-weight="600" fill="#2E7D32" text-anchor="middle">16</text>
  </g>

  <!-- Cycle Phase Insights -->
  <g transform="translate(20, 420)">
    <rect width="350" height="110" rx="24" fill="#FFF8F2" stroke="#FFE185" stroke-width="1"/>
    <circle cx="48" cy="40" r="22" fill="#FFE185"/>
    <text x="48" y="47" font-size="18" text-anchor="middle">✨</text>
    <text x="84" y="35" font-size="15" font-weight="700" fill="#26101B">Luteal Phase • Day 18</text>
    <text x="84" y="56" font-size="12" fill="#7A6472">Progesterone is peaking. You might feel calmer.</text>
    <text x="84" y="74" font-size="12" fill="#7A6472">Next period estimated in 10 days.</text>
  </g>

  <!-- Bottom Nav Bar -->
  <g transform="translate(0, 764)">
    <rect width="390" height="80" fill="#FFFFFF" stroke="#F5E8F0" stroke-width="1"/>
    <!-- Cycle Active -->
    <rect x="96" y="8" width="60" height="32" rx="16" fill="#FFE0F4"/>
    <text x="48" y="28" font-size="16" text-anchor="middle">📅</text>
    <text x="48" y="52" font-size="11" font-weight="500" fill="#7A6472" text-anchor="middle">Today</text>
    <text x="126" y="28" font-size="16" text-anchor="middle">🗓️</text>
    <text x="126" y="52" font-size="11" font-weight="700" fill="#92003A" text-anchor="middle">Cycle</text>
    <text x="204" y="28" font-size="16" text-anchor="middle">👶</text>
    <text x="204" y="52" font-size="11" font-weight="500" fill="#7A6472" text-anchor="middle">Baby</text>
    <text x="282" y="28" font-size="16" text-anchor="middle">🛍️</text>
    <text x="282" y="52" font-size="11" font-weight="500" fill="#7A6472" text-anchor="middle">Shop</text>
    <text x="350" y="28" font-size="16" text-anchor="middle">👤</text>
    <text x="350" y="52" font-size="11" font-weight="500" fill="#7A6472" text-anchor="middle">Profile</text>
  </g>
</svg>
