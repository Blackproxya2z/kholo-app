name: kholo
description: "KHOLO — One calm home for body, baby, and everyday care."
publish_to: 'none'
version: 1.4.1+23

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.0.0

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Local storage
  shared_preferences: ^2.3.0
  path_provider: ^2.1.3

  # Networking & Security
  http: ^1.2.2
  dio: ^5.7.0
  crypto: ^3.0.3

  # Fonts
  google_fonts: ^6.2.1

  # Calendar
  table_calendar: ^3.1.2

  # Charts
  fl_chart: ^0.68.0

  # Internationalization / dates
  intl: ^0.19.0
  timezone: ^0.9.4

  # ID generation
  uuid: ^4.4.2

  # Icons & UI extras
  cupertino_icons: ^1.0.8
  open_filex: ^4.3.4
  package_info_plus: ^8.1.0
  permission_handler: ^11.3.1
  flutter_local_notifications: ^18.0.0
  share_plus: ^10.1.1
  local_auth: ^2.3.0
  camera: ^0.11.0+2
  camera_android: ^0.10.9+5
  firebase_core: ^4.13.0
  firebase_crashlytics: ^5.2.7
  firebase_messaging: ^16.5.0
  firebase_remote_config: ^6.5.6
  firebase_analytics: ^12.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#4F46E5"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icon/
    - assets/version.json
