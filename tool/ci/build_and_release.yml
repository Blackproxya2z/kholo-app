name: Build, Test & Release KHOLO

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag (e.g. v1.1.0)'
        required: true
        default: 'v1.1.0'
      min_required_version:
        description: 'Minimum required version code (integer, for force update)'
        required: false
        default: '1'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release with SHA-256 Checksum
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Verify Code Health (Analyze)
        run: flutter analyze --no-pub

      - name: Run Automated Test Suite
        run: flutter test

      - name: Build Signed Production APK
        run: flutter build apk --release

      - name: Compute Cryptographic SHA-256 Checksum & Metadata
        id: checksum
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          SHA256=$(sha256sum "$APK_PATH" | awk '{print $1}')
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="${{ github.event.inputs.version_tag }}"
          fi
          
          # Extract clean version without 'v' prefix
          CLEAN_VER=$(echo "$TAG" | sed 's/^v//')
          
          echo "apk_sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "release_tag=$TAG" >> $GITHUB_OUTPUT
          echo "clean_version=$CLEAN_VER" >> $GITHUB_OUTPUT
          
          # Generate PRD-compliant version.json manifest
          cat <<EOF > version.json
          {
            "latest_version": "$CLEAN_VER",
            "version_code": ${{ github.run_number }},
            "min_required_version_code": 1,
            "download_url": "https://github.com/${{ github.repository }}/releases/download/$TAG/app-release.apk",
            "apk_sha256": "$SHA256",
            "release_notes": "Security-hardened release with SHA-256 anti-tamper validation and in-place upgrade engine."
          }
          EOF
          
          cat version.json

      - name: Publish GitHub Release with Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.checksum.outputs.release_tag }}
          name: "KHOLO ${{ steps.checksum.outputs.release_tag }}"
          body: |
            ## 🌸 KHOLO Release ${{ steps.checksum.outputs.release_tag }}
            
            ### 🔒 Anti-Tamper & Security Verification
            - **Binary Artifact**: `app-release.apk`
            - **Cryptographic SHA-256 Checksum**:
            ```
            ${{ steps.checksum.outputs.apk_sha256 }}
            ```
            
            ### 🚀 In-Place Upgrade Engine
            This release supports seamless in-place installation directly from the in-app update banner. Existing local logs and settings are preserved.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
